<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Catering Control · Driver</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="./config.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="./supabase-client.js" defer></script>
  <!-- ExcelJS (~1MB) ya no se carga aquí en cada visita: index.js lo pide
       bajo demanda solo cuando el usuario exporta un Excel (procesar día,
       exportar dietas, exportar orden de ruta). Así el panel carga más
       liviano y rápido en el uso normal del día a día. -->
  <link rel="stylesheet" href="./index.css?v=15">
  <!-- Ajustes propios de la web del driver (encima de index.css, no lo
       reemplaza — ver driver.css para el detalle). -->
  <link rel="stylesheet" href="./driver.css?v=2">
  <!-- Leaflet: mapa con tiles de OpenStreetMap (gratis, sin API key) para el
       botón "Ver mapa" de Reparto. Se usa solo cuando se abre el mapa. -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">

  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0d6efd">
  <link rel="icon" href="./icons/favicon-32.png" type="image/png">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Catering">
</head>
<body>

  <div id="app">
    <aside>
      <div class="aside-title">
        <div class="brand"><div class="brand-mark" id="brand-mark">🍽</div><strong id="brand-name">Catering Control</strong></div>
        <button class="collapse-toggle" id="sidebar-collapse-btn" aria-label="Contraer menú" title="Contraer menú">«</button>
        <button class="menu-toggle" id="menu-toggle" aria-label="Abrir menú">☰</button>
      </div>
      <nav id="nav">
        <button data-page="dispatch" data-roles="driver"><span class="nav-icon">📅</span><span class="nav-label">Día de trabajo</span></button>
        <button data-page="clients" data-roles="driver"><span class="nav-icon">👥</span><span class="nav-label">Clientes</span></button>
        <button data-page="delivery" data-roles="driver" class="active"><span class="nav-icon">🚚</span><span class="nav-label">Despacho</span></button>
        <button data-page="payroll" data-roles="driver"><span class="nav-icon">💵</span><span class="nav-label">Sueldos</span></button>
        <button data-page="settings" data-roles="driver"><span class="nav-icon">🛠️</span><span class="nav-label">Configuración</span></button>
      </nav>
      <div class="aside-bottom">
        <div class="profile" id="profile-link" style="cursor:pointer" title="Ver sesión">
          <div class="avatar" id="avatar">👤</div>
          <div><b id="current-name">Operaciones</b><small class="muted" id="current-role" style="display:block;font-size:10px;">Administrador</small></div>
        </div>
        <div class="aside-bottom-actions">
          <button class="danger" id="logout-btn" title="Cerrar sesión"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg><span class="btn-text"> Salir</span></button>
          <div class="mobile-sync-group">
            <div class="sync-pill" id="sync-pill" title="Estado de sincronización"><span class="sync-dot" id="sync-dot"></span><span id="sync-text" class="sync-text-label">Listo</span></div>
            <button class="refresh" id="manual-sync-btn" title="Sincronizar"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg><span class="btn-text"> Sincronizar</span></button>
          </div>
        </div>
      </div>
    </aside>
    <main>
      <section class="page active" id="delivery-page"></section>
      <section class="page" id="dispatch-page"></section>
      <section class="page" id="clients-page"></section>
      <section class="page" id="payroll-page"></section>
      <section class="page" id="settings-page"></section>
    </main>
  </div>

  <dialog id="modal"><form method="dialog" class="app-modal" id="modal-form"><div class="app-modal-head"><h2 id="modal-title"></h2><button type="button" class="close" id="modal-close" aria-label="Cerrar">×</button></div><div class="app-modal-body" id="modal-body"></div><div class="app-modal-foot" id="modal-foot"><button type="button" id="modal-cancel" value="cancel">Cancelar</button><button class="primary" id="modal-save" value="default">Guardar</button></div></form></dialog>
  <input id="import-file" type="file" accept="application/json" hidden>
  <div class="notice" id="notice"></div>

  <script src="./driver.js?v=2" defer></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous" defer></script>
<script src="./pwa-register.js?v=3" defer></script>
</body>
</html>
