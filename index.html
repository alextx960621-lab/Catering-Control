<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Catering Control · Operaciones</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="./config.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="./supabase-client.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js" defer></script>
  <link rel="stylesheet" href="./index.css">
</head>
<body>

  <!-- ===== APP (la sesión es una página más del menú, no una pantalla aparte) ===== -->
  <div id="app">
    <aside>
      <div class="aside-title">
        <div class="brand"><div class="brand-mark" id="brand-mark">🍽</div><strong id="brand-name">Catering Control</strong></div>
        <button class="menu-toggle" id="menu-toggle" aria-label="Abrir menú">☰</button>
        <small>Gestión de operaciones</small>
      </div>
      <nav id="nav">
        <button data-page="dispatch" data-roles="admin,editor,kitchen,driver" class="active"><span class="nav-icon">▦</span>Día de trabajo</button>
        <button data-page="clients" data-roles="admin,editor,driver"><span class="nav-icon">♙</span>Clientes</button>
        <button data-page="drivers" data-roles="admin,editor"><span class="nav-icon">⌁</span>Drivers</button>
        <button data-page="routes" data-roles="admin,editor"><span class="nav-icon">⌘</span>Rutas</button>
        <button data-page="plans" data-roles="admin,editor"><span class="nav-icon">▤</span>Planes</button>
        <button data-page="payroll" data-roles="admin,editor,driver"><span class="nav-icon">💵</span>Sueldos</button>
        <button data-page="inventory" data-roles="admin,editor,kitchen"><span class="nav-icon">▧</span>Inventario</button>
        <button data-page="users" data-roles="admin"><span class="nav-icon">♟</span>Usuarios</button>
        <button data-page="settings" data-roles="admin,editor,kitchen,driver"><span class="nav-icon">⚙</span>Configuración</button>
      </nav>
      <div class="aside-bottom">
        <div class="profile" id="profile-link" style="cursor:pointer" title="Ver sesión">
          <div class="avatar" id="avatar">👤</div>
          <div><b id="current-name">Operaciones</b><small class="muted" id="current-role" style="display:block;font-size:10px;">Administrador</small></div>
        </div>
        <div class="aside-bottom-actions">
          <button class="outline" id="logout-btn" title="Cerrar sesión"><span aria-hidden="true">⏻</span><span class="btn-text"> Salir</span></button>
          <div class="mobile-sync-group">
            <div class="sync-pill" id="sync-pill" title="Estado de sincronización"><span class="sync-dot" id="sync-dot"></span><span id="sync-text" class="sync-text-label">Listo</span></div>
            <button class="outline" id="manual-sync-btn" title="Sincronizar"><span aria-hidden="true">🔄</span><span class="btn-text"> Sincronizar</span></button>
          </div>
        </div>
      </div>
    </aside>
    <main>
      <section class="page active" id="dispatch-page"></section>
      <section class="page" id="clients-page"></section>
      <section class="page" id="drivers-page"></section>
      <section class="page" id="routes-page"></section>
      <section class="page" id="plans-page"></section>
      <section class="page" id="payroll-page"></section>
      <section class="page" id="inventory-page"></section>
      <section class="page" id="users-page"></section>
      <section class="page" id="settings-page"></section>
    </main>
  </div>

  <dialog id="modal"><form method="dialog" class="app-modal" id="modal-form"><div class="app-modal-head"><h2 id="modal-title"></h2><button type="button" class="close" id="modal-close" aria-label="Cerrar">×</button></div><div class="app-modal-body" id="modal-body"></div><div class="app-modal-foot" id="modal-foot"><button value="cancel">Cancelar</button><button class="primary" id="modal-save" value="default">Guardar</button></div></form></dialog>
  <input id="import-file" type="file" accept="application/json" hidden>
  <div class="notice" id="notice"></div>

  <script src="./index.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous" defer></script>
</body>
</html>
