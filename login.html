<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Catering Control · Iniciar sesión</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

  <!-- Igual que antes: config.js define window.APP_CONFIG y
       supabase-client.js expone window.SupabaseDB. Esta página React no
       cambia nada de esos dos archivos ni de cómo funciona Supabase. -->
  <script src="./config.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="./supabase-client.js" defer></script>

  <!-- React sin paso de compilación (Vite/npm): se carga la librería y un
       transpilador de JSX (Babel) directamente desde CDN. Es la forma más
       simple de tener "un solo archivo" que funciona con solo subirlo,
       igual que el resto de tu app. El costo es que Babel transpila el
       JSX en el navegador cada vez que carga la página — para un login
       (una página chica, que no se recarga todo el rato) es imperceptible.
       Si más adelante migras páginas más grandes (Dispatch, Métricas),
       ahí sí conviene pasar a un build real con Vite para que cargue más
       rápido y puedas dividir el código en archivos. -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0d6efd">
  <link rel="icon" href="./icons/favicon-32.png" type="image/png">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Catering">

  <style>
    /* ===== Contenido de login.css, sin cambios de diseño ===== */
    html { font-size:15px; }
    :root {
      --brand:#0d6efd;
      --font:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
      --font-display:Figtree,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    }
    body { min-height:100vh; font-family:var(--font); background:radial-gradient(circle at 20% 20%,rgba(13,110,253,.2),transparent 34%),#f5f7fb; }
    #brand-title, .btn, .nav-pills .nav-link { font-family:var(--font-display); }
    .btn-primary {
      --bs-btn-bg: var(--brand);
      --bs-btn-border-color: var(--brand);
      --bs-btn-hover-bg: var(--brand);
      --bs-btn-hover-border-color: var(--brand);
      --bs-btn-active-bg: var(--brand);
      --bs-btn-active-border-color: var(--brand);
      --bs-btn-disabled-bg: var(--brand);
      --bs-btn-disabled-border-color: var(--brand);
      filter: brightness(1);
      transition: filter .15s, transform .15s ease, box-shadow .15s ease;
    }
    .btn-primary:hover, .btn-primary:active { filter: brightness(.92); }
    .btn-primary, #whatsapp-support-btn {
      border-radius: 999px;
      box-shadow: 0 4px 14px color-mix(in srgb, var(--brand) 35%, transparent);
    }
    .btn-primary:hover, #whatsapp-support-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 22px color-mix(in srgb, var(--brand) 40%, transparent);
    }
    .btn-primary:active { transform: translateY(0) scale(.98); }
    #whatsapp-support-btn { transition: transform .15s ease, box-shadow .15s ease, background .15s ease; }
    .nav-pills .nav-link { border-radius: 999px; }
    .login-card { max-width:420px; }
    .login-card .card { overflow:hidden; }
    .brand-row { display:flex; align-items:center; gap:16px; }
    .brand-info { min-width:0; flex:1; }
    .brand-mark { width:72px; height:72px; flex:0 0 auto; border-radius:1rem; overflow:hidden; background:var(--brand); transition:background .2s; }
    .brand-mark img { width:100%; height:100%; object-fit:contain; }
    .form-panel { display:none; }
    .form-panel.active { display:block; }
    [data-theme="night"] { --brand:#7296ff; }
    [data-theme="night"] body { background:radial-gradient(circle at 20% 20%,rgba(114,150,255,.25),transparent 34%),#121824; }
    [data-theme="night"] .card { background:#1a2130; color:#e7ecf5; }
    [data-theme="night"] .text-secondary { color:#9aa7bd!important; }
    [data-theme="night"] .form-control, [data-theme="night"] .form-select { background:#121824; color:#e7ecf5; border-color:#2b3648; }
    [data-theme="night"] .bg-body-tertiary { background:#121824!important; }
    [data-theme="forest"] { --brand:#1f7a4d; }
    [data-theme="forest"] body { background:radial-gradient(circle at 20% 20%,rgba(31,122,77,.25),transparent 34%),#dcefdc; }
    [data-theme="forest"] .card { background:#eef7ee; }
    [data-theme="forest"] .bg-body-tertiary { background:#cde6cd!important; }
    #whatsapp-support-btn:hover { background:#20bd5a!important; color:#fff; }
  </style>
</head>
<body class="d-flex align-items-center py-4">
  <main class="container">
    <div class="row justify-content-center">
      <div class="col-12 login-card">
        <!-- Todo lo de adentro de esta tarjeta lo dibuja React. -->
        <div id="root"></div>
      </div>
    </div>
  </main>

  <script type="text/babel" data-type="module">
    // Blindaje de orden de carga: config.js y supabase-client.js cargan con
    // "defer" y en teoría ya están listos cuando Babel ejecuta este bloque
    // (Babel espera al evento DOMContentLoaded, que ocurre después de los
    // scripts defer). Aun así, para no depender de esa sutileza en todos los
    // navegadores/velocidades de red, se espera explícitamente a que ambos
    // existan antes de arrancar React.
    function boot() {
    const { useState, useEffect, useRef, useCallback } = React;

    const APP_CONFIG = window.APP_CONFIG;
    const BRANDING_CACHE_KEY = `${APP_CONFIG.storagePrefix}-branding-cache-v1`;
    const STAFF_SESSION_KEY = `${APP_CONFIG.storagePrefix}-staff-session-v1`;
    const CLIENT_SESSION_KEY = `${APP_CONFIG.storagePrefix}-client-session-v1`;
    const UI_THEME_KEY = `${APP_CONFIG.storagePrefix}-ui-theme-v1`;
    const STAFF_APP_URL = './index.html';
    const DRIVER_APP_URL = './driver.html';
    const CLIENT_PORTAL_URL = './cliente.html';
    function staffDestination(role) { return role === 'driver' ? DRIVER_APP_URL : STAFF_APP_URL; }

    function readCachedBranding() {
      try { return JSON.parse(localStorage.getItem(BRANDING_CACHE_KEY)) || null; }
      catch (_) { return null; }
    }

    // ---------- Logo / nombre de la empresa (con caché, igual que antes) ----------
    function BrandMark({ logo, name }) {
      const [broken, setBroken] = useState(false);
      if (logo && !broken) {
        return <img src={logo} alt={name} onError={() => setBroken(true)} />;
      }
      return <>🍽</>;
    }

    // ---------- Selector de tema ----------
    function ThemeSelect({ theme, onChange }) {
      return (
        <div className="d-inline-flex align-items-center gap-2">
          <label className="form-label small text-secondary mb-0" htmlFor="theme-select">Tema</label>
          <select
            className="form-select form-select-sm"
            id="theme-select"
            style={{ width: 'auto' }}
            value={theme}
            onChange={e => onChange(e.target.value)}
          >
            <option value="light">Claro</option>
            <option value="night">Nocturno</option>
            <option value="forest">Bosque</option>
          </select>
        </div>
      );
    }

    // ---------- Formulario "Soy cliente" ----------
    function ClientForm({ active, onError, onClearError }) {
      const [carnet, setCarnet] = useState('');
      const [phone, setPhone] = useState('');
      const [loading, setLoading] = useState(false);

      async function handleSubmit(e) {
        e.preventDefault();
        onClearError();
        setLoading(true);
        try {
          const cleanCarnet = carnet.trim();
          const cleanPhone = phone.replace(/\D/g, '');
          const rows = await window.SupabaseDB?.rpc('login_cliente', { p_carnet: cleanCarnet, p_phone: cleanPhone });
          const client = Array.isArray(rows) ? rows[0] : null;
          if (!client) { onError('Carnet o teléfono no coinciden con un cliente registrado.'); return; }
          sessionStorage.setItem(CLIENT_SESSION_KEY, JSON.stringify({ id: client.id, name: client.name }));
          window.location.href = CLIENT_PORTAL_URL;
        } catch (_) {
          onError('No se pudo conectar. Revisa tu internet e intenta de nuevo.');
        } finally {
          setLoading(false);
        }
      }

      return (
        <form className={`form-panel${active ? ' active' : ''}`} onSubmit={handleSubmit}>
          <div className="mb-3">
            <label className="form-label" htmlFor="client-carnet">Carnet de identidad</label>
            <input className="form-control" id="client-carnet" autoComplete="username" placeholder="Ej. 12345678" required
              value={carnet} onChange={e => setCarnet(e.target.value)} />
          </div>
          <div className="mb-3">
            <label className="form-label" htmlFor="client-phone">Teléfono</label>
            <input className="form-control" id="client-phone" inputMode="tel" autoComplete="current-password" placeholder="70000000" required
              value={phone} onChange={e => setPhone(e.target.value)} />
          </div>
          <button className="btn btn-primary w-100" type="submit" disabled={loading}>
            {loading ? 'Entrando…' : 'Entrar a mi plan'}
          </button>
        </form>
      );
    }

    // ---------- Formulario "Soy del equipo" ----------
    function StaffForm({ active, onError, onClearError }) {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [showPassword, setShowPassword] = useState(false);
      const [loading, setLoading] = useState(false);

      async function handleSubmit(e) {
        e.preventDefault();
        onClearError();
        setLoading(true);
        try {
          const cleanEmail = email.trim();
          const rows = await window.SupabaseDB?.rpc('login_staff', { p_email: cleanEmail, p_password: password });
          const person = Array.isArray(rows) ? rows[0] : null;
          if (person?.locked_seconds > 0) {
            onError(`Demasiados intentos fallidos. Espera ${person.locked_seconds} segundos e intenta de nuevo.`);
            return;
          }
          // Blindaje extra: solo se acepta la respuesta si trae un id real.
          // Antes también exigía que el rol estuviera en una lista fija, pero
          // esa lista no incluía "superadmin" (ni roles personalizados que
          // crees en Usuarios) y por eso bloqueaba el login aunque la
          // contraseña fuera correcta. La validación de verdad (contraseña,
          // cuenta bloqueada) ya la hace el backend en login_staff — acá solo
          // nos aseguramos de que vino algo utilizable.
          const validPerson = person && typeof person.id === 'string' && person.id.trim() && typeof person.role === 'string' && person.role.trim();
          if (!validPerson) { onError('Correo o contraseña incorrectos.'); return; }
          sessionStorage.setItem(STAFF_SESSION_KEY, JSON.stringify({
            id: person.id, name: person.name, role: person.role,
            routeId: person.routeId || '', driverId: person.driverId || ''
          }));
          window.location.href = staffDestination(person.role);
        } catch (_) {
          onError('No se pudo conectar. Revisa tu internet e intenta de nuevo.');
        } finally {
          setLoading(false);
        }
      }

      return (
        <form className={`form-panel${active ? ' active' : ''}`} onSubmit={handleSubmit}>
          <div className="mb-3">
            <label className="form-label" htmlFor="staff-email">Correo</label>
            <input className="form-control" id="staff-email" type="email" autoComplete="username" required
              value={email} onChange={e => setEmail(e.target.value)} />
          </div>
          <div className="mb-3">
            <label className="form-label" htmlFor="staff-pass">Contraseña</label>
            <div className="input-group">
              <input className="form-control" id="staff-pass" type={showPassword ? 'text' : 'password'} autoComplete="current-password" required
                value={password} onChange={e => setPassword(e.target.value)} />
              <button className="btn btn-outline-secondary" type="button"
                aria-label={showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'}
                onClick={() => setShowPassword(v => !v)}>
                {showPassword ? '😆' : '😃'}
              </button>
            </div>
          </div>
          <button className="btn btn-primary w-100" type="submit" disabled={loading}>
            {loading ? 'Entrando…' : 'Entrar al panel'}
          </button>
        </form>
      );
    }

    // ---------- App principal ----------
    function App() {
      const cached = readCachedBranding();
      const [theme, setTheme] = useState(() => localStorage.getItem(UI_THEME_KEY) || 'light');
      const [accessType, setAccessType] = useState('client');
      const [errorMsg, setErrorMsg] = useState('');
      const [brandName, setBrandName] = useState(cached?.name || APP_CONFIG.companyName);
      const [brandLogo, setBrandLogo] = useState(cached?.logo || APP_CONFIG.logoUrl || '');
      const [whatsappNumber, setWhatsappNumber] = useState(cached?.whatsappNumber || APP_CONFIG.whatsappNumber || '');
      const redirected = useRef(false);

      // Tema: se refleja como atributo data-theme en <html>, igual que el
      // login.js original — el CSS de arriba ya está escrito para leerlo así.
      useEffect(() => {
        document.documentElement.dataset.theme = theme;
        localStorage.setItem(UI_THEME_KEY, theme);
      }, [theme]);

      // Título de la pestaña.
      useEffect(() => {
        document.title = `${brandName} · Iniciar sesión`;
      }, [brandName]);

      // Si ya hay una sesión de staff activa, saltar directo al panel
      // correspondiente — se revisa una sola vez al montar.
      useEffect(() => {
        if (redirected.current) return;
        try {
          const existing = JSON.parse(sessionStorage.getItem(STAFF_SESSION_KEY));
          if (existing) { redirected.current = true; window.location.href = staffDestination(existing.role); }
        } catch (_) {}
      }, []);

      // Trae el branding real desde Supabase (nombre, logo, WhatsApp) y
      // actualiza la caché local para que la próxima carga sea instantánea.
      useEffect(() => {
        let cancelled = false;
        (async () => {
          let settings = null;
          try { settings = await window.SupabaseDB?.rpc('get_branding', {}); } catch (_) {}
          if (cancelled || !settings) return;
          const name = settings.companyName?.trim() || APP_CONFIG.companyName;
          const logo = settings.logoUrl || APP_CONFIG.logoUrl || '';
          const whatsapp = settings.whatsappNumber || '';
          setBrandName(name);
          setBrandLogo(logo);
          if (whatsapp) setWhatsappNumber(whatsapp);
          try {
            localStorage.setItem(BRANDING_CACHE_KEY, JSON.stringify({ name, logo, whatsappNumber: whatsapp }));
          } catch (_) {}
        })();
        return () => { cancelled = true; };
      }, []);

      const cleanWhatsapp = String(whatsappNumber || '').replace(/\D/g, '');

      return (
        <section className="card shadow-lg border-0 rounded-4">
          <div className="card-body p-4 p-md-5">
            <div className="brand-row mb-4">
              <div className="brand-mark d-inline-flex align-items-center justify-content-center fs-2" id="brand-mark">
                <BrandMark logo={brandLogo} name={brandName} />
              </div>
              <div className="brand-info">
                <h1 className="h5 mb-1" id="brand-title">{brandName}</h1>
                <ThemeSelect theme={theme} onChange={setTheme} />
              </div>
            </div>

            <nav className="nav nav-pills nav-fill bg-body-tertiary rounded-pill p-1 mb-4" aria-label="Tipo de acceso">
              <button type="button" className={`nav-link${accessType === 'client' ? ' active' : ''}`}
                onClick={() => { setAccessType('client'); setErrorMsg(''); }}>Soy cliente</button>
              <button type="button" className={`nav-link${accessType === 'staff' ? ' active' : ''}`}
                onClick={() => { setAccessType('staff'); setErrorMsg(''); }}>Soy del equipo</button>
            </nav>

            <ClientForm active={accessType === 'client'} onError={setErrorMsg} onClearError={() => setErrorMsg('')} />
            <StaffForm active={accessType === 'staff'} onError={setErrorMsg} onClearError={() => setErrorMsg('')} />

            {errorMsg && <div className="alert alert-danger mt-3 mb-0" role="alert">{errorMsg}</div>}

            {cleanWhatsapp && (
              <a className="btn w-100 mt-3 d-flex align-items-center justify-content-center gap-2"
                id="whatsapp-support-btn"
                href={`https://wa.me/${cleanWhatsapp}?text=${encodeURIComponent('Hola, necesito ayuda para ingresar a Catering Control.')}`}
                target="_blank" rel="noopener"
                style={{ background: '#25D366', color: '#fff', fontWeight: 650 }}>
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="20" height="20" fill="currentColor" aria-hidden="true">
                  <path d="M16.004 3C9.377 3 4 8.373 4 15c0 2.386.702 4.607 1.912 6.47L4 29l7.72-1.877A11.94 11.94 0 0 0 16.004 27C22.63 27 28 21.627 28 15S22.63 3 16.004 3zm0 21.75c-1.98 0-3.83-.55-5.41-1.5l-.388-.23-4.58 1.114 1.14-4.46-.253-.4A9.71 9.71 0 0 1 5.25 15c0-5.93 4.82-10.75 10.754-10.75S26.75 9.07 26.75 15 21.938 24.75 16.004 24.75zm5.98-8.06c-.328-.164-1.94-.957-2.24-1.066-.3-.11-.518-.164-.737.164-.218.328-.845 1.066-1.037 1.285-.19.218-.382.246-.71.082-.328-.164-1.385-.51-2.637-1.628-.975-.87-1.633-1.944-1.824-2.272-.19-.328-.02-.505.144-.668.148-.147.328-.383.492-.574.164-.19.218-.328.328-.546.11-.218.055-.41-.027-.574-.082-.164-.737-1.776-1.01-2.432-.266-.64-.537-.553-.737-.563l-.628-.012c-.218 0-.573.082-.873.41-.3.328-1.146 1.12-1.146 2.73 0 1.61 1.174 3.166 1.337 3.384.164.218 2.31 3.53 5.6 4.95.783.338 1.393.54 1.87.69.786.25 1.5.215 2.065.13.63-.094 1.94-.793 2.213-1.56.273-.766.273-1.423.19-1.56-.08-.14-.298-.22-.626-.383z"/>
                </svg>
                <span>¿Necesitas ayuda? Contactanos</span>
              </a>
            )}
          </div>
        </section>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    } // fin de boot()

    if (window.APP_CONFIG && window.SupabaseDB) {
      boot();
    } else {
      const waitForDeps = setInterval(() => {
        if (window.APP_CONFIG && window.SupabaseDB) { clearInterval(waitForDeps); boot(); }
      }, 20);
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous" defer></script>
<script src="./pwa-register.js?v=3" defer></script>
</body>
</html>
