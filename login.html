<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Catering Control · Iniciar sesión</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="./config.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="./supabase-client.js" defer></script>
  <link rel="stylesheet" href="./login.css?v=3">

  <!-- ===== PWA: manifest + íconos + color de tema ===== -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0d6efd">
  <link rel="icon" href="./icons/favicon-32.png" type="image/png">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Catering">
</head>
<body class="d-flex align-items-center py-4">
  <main class="container">
    <div class="row justify-content-center">
      <div class="col-12 login-card">
        <section class="card shadow-lg border-0 rounded-4">
          <div class="card-body p-4 p-md-5">
            <div class="brand-row mb-4">
              <div class="brand-mark d-inline-flex align-items-center justify-content-center fs-2" id="brand-mark"></div>
              <div class="brand-info">
                <h1 class="h5 mb-1" id="brand-title">Catering Control</h1>
                <div class="d-inline-flex align-items-center gap-2">
                  <label class="form-label small text-secondary mb-0" for="theme-select">Tema</label>
                  <select class="form-select form-select-sm" id="theme-select" style="width:auto">
                    <option value="light">Claro</option>
                    <option value="night">Nocturno</option>
                    <option value="forest">Bosque</option>
                  </select>
                </div>
              </div>
            </div>

            <nav class="nav nav-pills nav-fill bg-body-tertiary rounded-pill p-1 mb-4" aria-label="Tipo de acceso">
              <button type="button" id="tab-client" class="nav-link active">Soy cliente</button>
              <button type="button" id="tab-staff" class="nav-link">Soy del equipo</button>
            </nav>

            <form id="form-client" class="form-panel active">
              
              <div class="mb-3"><label class="form-label" for="client-carnet">Carnet de identidad</label><input class="form-control" id="client-carnet" autocomplete="username" placeholder="Ej. 12345678" required></div>
              <div class="mb-3"><label class="form-label" for="client-phone">Teléfono</label><input class="form-control" id="client-phone" inputmode="tel" autocomplete="current-password" placeholder="70000000" required></div>
              <button class="btn btn-primary w-100" type="submit">Entrar a mi plan</button>
            </form>

            <form id="form-staff" class="form-panel">
              
              <div class="mb-3"><label class="form-label" for="staff-email">Correo</label><input class="form-control" id="staff-email" type="email" autocomplete="username" required></div>
              <div class="mb-3"><label class="form-label" for="staff-pass">Contraseña</label>
                <div class="input-group">
                  <input class="form-control" id="staff-pass" type="password" autocomplete="current-password" required>
                  <button class="btn btn-outline-secondary" type="button" id="toggle-staff-pass" aria-label="Mostrar contraseña">👁</button>
                </div>
              </div>
              <button class="btn btn-primary w-100" type="submit">Entrar al panel</button>
            </form>
            <div class="alert alert-danger mt-3 mb-0 d-none" id="error-msg" role="alert"></div>
            <a class="btn w-100 mt-3 d-none d-flex align-items-center justify-content-center gap-2" id="whatsapp-support-btn" href="#" target="_blank" rel="noopener" style="background:#25D366;color:#fff;font-weight:650">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M16.004 3C9.377 3 4 8.373 4 15c0 2.386.702 4.607 1.912 6.47L4 29l7.72-1.877A11.94 11.94 0 0 0 16.004 27C22.63 27 28 21.627 28 15S22.63 3 16.004 3zm0 21.75c-1.98 0-3.83-.55-5.41-1.5l-.388-.23-4.58 1.114 1.14-4.46-.253-.4A9.71 9.71 0 0 1 5.25 15c0-5.93 4.82-10.75 10.754-10.75S26.75 9.07 26.75 15 21.938 24.75 16.004 24.75zm5.98-8.06c-.328-.164-1.94-.957-2.24-1.066-.3-.11-.518-.164-.737.164-.218.328-.845 1.066-1.037 1.285-.19.218-.382.246-.71.082-.328-.164-1.385-.51-2.637-1.628-.975-.87-1.633-1.944-1.824-2.272-.19-.328-.02-.505.144-.668.148-.147.328-.383.492-.574.164-.19.218-.328.328-.546.11-.218.055-.41-.027-.574-.082-.164-.737-1.776-1.01-2.432-.266-.64-.537-.553-.737-.563l-.628-.012c-.218 0-.573.082-.873.41-.3.328-1.146 1.12-1.146 2.73 0 1.61 1.174 3.166 1.337 3.384.164.218 2.31 3.53 5.6 4.95.783.338 1.393.54 1.87.69.786.25 1.5.215 2.065.13.63-.094 1.94-.793 2.213-1.56.273-.766.273-1.423.19-1.56-.08-.14-.298-.22-.626-.383z"/></svg>
              <span>¿Necesitas ayuda? Contactanos</span>
            </a>
          </div>
        </section>
      </div>
    </div>
  </main>

<script src="./login.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous" defer></script>
<script src="./pwa-register.js?v=2" defer></script>
</body>
</html>
