<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Catering Control · Iniciar sesión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="./config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase-client.js"></script>
  <style>
    body { min-height:100vh; background:radial-gradient(circle at 20% 20%,rgba(13,110,253,.2),transparent 34%),#f5f7fb; }
    .login-card { max-width:420px; }
    .brand-mark { width:44px; height:44px; border-radius:.8rem; overflow:hidden; background:#0d6efd; flex:0 0 auto; }
    .brand-mark img { width:100%; height:100%; object-fit:contain; }
    .form-panel { display:none; }
    .form-panel.active { display:block; }
    [data-theme="night"] body { background:radial-gradient(circle at 20% 20%,rgba(13,110,253,.25),transparent 34%),#121824; }
    [data-theme="night"] .card { background:#1a2130; color:#e7ecf5; }
    [data-theme="night"] .text-secondary { color:#9aa7bd!important; }
    [data-theme="night"] .form-control, [data-theme="night"] .form-select { background:#121824; color:#e7ecf5; border-color:#2b3648; }
    [data-theme="night"] .bg-body-tertiary { background:#121824!important; }
    [data-theme="forest"] body { background:radial-gradient(circle at 20% 20%,rgba(25,135,84,.25),transparent 34%),#dcefdc; }
    [data-theme="forest"] .card { background:#eef7ee; }
    [data-theme="forest"] .bg-body-tertiary { background:#cde6cd!important; }
    #whatsapp-support-btn:hover { background:#20bd5a!important; color:#fff; }
  </style>
</head>
<body class="d-flex align-items-center py-4">
  <main class="container">
    <div class="row justify-content-center">
      <div class="col-12 login-card">
        <section class="card shadow-lg border-0 rounded-4">
          <div class="card-body p-4 p-md-5">
            <div class="d-flex align-items-center gap-3 mb-4">
              <div class="brand-mark d-flex align-items-center justify-content-center fs-4" id="brand-mark"></div>
              <div class="flex-grow-1"><h1 class="h4 mb-0" id="brand-title">Catering Control</h1><p class="text-secondary small mb-0">Iniciar sesión</p></div>
              <div class="flex-shrink-0 d-flex align-items-center gap-2">
                <label class="form-label small text-secondary mb-0" for="theme-select">Tema</label>
                <select class="form-select form-select-sm" id="theme-select" style="width:auto">
                  <option value="light">Claro</option>
                  <option value="night">Nocturno</option>
                  <option value="forest">Bosque</option>
                </select>
              </div>
            </div>

            <nav class="nav nav-pills nav-fill bg-body-tertiary rounded-3 p-1 mb-4" aria-label="Tipo de acceso">
              <button type="button" id="tab-client" class="nav-link active">Soy cliente</button>
              <button type="button" id="tab-staff" class="nav-link">Soy del equipo</button>
            </nav>

            <form id="form-client" class="form-panel active">
              <p class="text-secondary small">Ingresa con tu carnet de identidad y el teléfono registrado en tu plan.</p>
              <div class="mb-3"><label class="form-label" for="client-carnet">Carnet de identidad</label><input class="form-control" id="client-carnet" autocomplete="username" placeholder="Ej. 1234567 LP" required></div>
              <div class="mb-3"><label class="form-label" for="client-phone">Teléfono</label><input class="form-control" id="client-phone" inputmode="tel" autocomplete="current-password" placeholder="70000000" required></div>
              <button class="btn btn-primary w-100" type="submit">Entrar a mi plan</button>
            </form>

            <form id="form-staff" class="form-panel">
              <p class="text-secondary small">Acceso del equipo operativo.</p>
              <div class="mb-3"><label class="form-label" for="staff-email">Correo</label><input class="form-control" id="staff-email" type="email" autocomplete="username" required></div>
              <div class="mb-3"><label class="form-label" for="staff-pass">Contraseña</label>
                <div class="input-group">
                  <input class="form-control" id="staff-pass" type="password" autocomplete="current-password" required>
                  <button class="btn btn-outline-secondary" type="button" id="toggle-staff-pass" aria-label="Mostrar contraseña">👁</button>
                </div>
              </div>
              <button class="btn btn-primary w-100" type="submit">Entrar al panel</button>
            </form>
            <div class="alert alert-danger mt-3 mb-0 d-none" id="error-msg" role="alert"></div>
            <a class="btn w-100 mt-3 d-none d-flex align-items-center justify-content-center gap-2" id="whatsapp-support-btn" href="#" target="_blank" rel="noopener" style="background:#25D366;color:#fff;font-weight:650">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M16.004 3C9.377 3 4 8.373 4 15c0 2.386.702 4.607 1.912 6.47L4 29l7.72-1.877A11.94 11.94 0 0 0 16.004 27C22.63 27 28 21.627 28 15S22.63 3 16.004 3zm0 21.75c-1.98 0-3.83-.55-5.41-1.5l-.388-.23-4.58 1.114 1.14-4.46-.253-.4A9.71 9.71 0 0 1 5.25 15c0-5.93 4.82-10.75 10.754-10.75S26.75 9.07 26.75 15 21.938 24.75 16.004 24.75zm5.98-8.06c-.328-.164-1.94-.957-2.24-1.066-.3-.11-.518-.164-.737.164-.218.328-.845 1.066-1.037 1.285-.19.218-.382.246-.71.082-.328-.164-1.385-.51-2.637-1.628-.975-.87-1.633-1.944-1.824-2.272-.19-.328-.02-.505.144-.668.148-.147.328-.383.492-.574.164-.19.218-.328.328-.546.11-.218.055-.41-.027-.574-.082-.164-.737-1.776-1.01-2.432-.266-.64-.537-.553-.737-.563l-.628-.012c-.218 0-.573.082-.873.41-.3.328-1.146 1.12-1.146 2.73 0 1.61 1.174 3.166 1.337 3.384.164.218 2.31 3.53 5.6 4.95.783.338 1.393.54 1.87.69.786.25 1.5.215 2.065.13.63-.094 1.94-.793 2.213-1.56.273-.766.273-1.423.19-1.56-.08-.14-.298-.22-.626-.383z"/></svg>
              <span>¿Necesitas ayuda? Habla con soporte</span>
            </a>
          </div>
        </section>
      </div>
    </div>
  </main>

<script>
/* La configuración de la empresa vive en config.js (un solo archivo
   para toda la app: marca + credenciales de Supabase). */
const APP_CONFIG = window.APP_CONFIG;
document.getElementById('brand-title').textContent = APP_CONFIG.companyName;
document.title = `${APP_CONFIG.companyName} · Iniciar sesión`;
document.getElementById('brand-mark').innerHTML = APP_CONFIG.logoUrl
  ? `<img src="${APP_CONFIG.logoUrl}" alt="${APP_CONFIG.companyName}" onerror="this.parentElement.textContent='🍽'">`
  : '🍽';
const waBtn = document.getElementById('whatsapp-support-btn');
function updateWhatsappButton(number) {
  const num = String(number || '').replace(/\D/g, '');
  if (num) {
    waBtn.href = `https://wa.me/${num}?text=${encodeURIComponent('Hola, necesito ayuda para ingresar a Catering Control.')}`;
    waBtn.classList.remove('d-none');
  } else {
    waBtn.classList.add('d-none');
  }
}
updateWhatsappButton(APP_CONFIG.whatsappNumber);
(async () => {
  try {
    const personal = await window.SupabaseDB?.dbGet('personal');
    const name = personal?.settings?.companyName?.trim();
    const logo = personal?.settings?.logoUrl;
    if (name) { document.getElementById('brand-title').textContent = name; document.title = `${name} · Iniciar sesión`; }
    if (logo) { document.getElementById('brand-mark').innerHTML = `<img src="${logo}" alt="${name || APP_CONFIG.companyName}">`; }
    if (personal?.settings?.whatsappNumber) updateWhatsappButton(personal.settings.whatsappNumber);
  } catch (_) {}
})();
/* ========================================================================== */

const STAFF_SESSION_KEY = `${APP_CONFIG.storagePrefix}-staff-session-v1`;
const STAFF_APP_URL = './index.html';
const CLIENT_PORTAL_URL = './cliente.html';
const CLIENT_SESSION_KEY = `${APP_CONFIG.storagePrefix}-client-session-v1`;
// Preferencia de tema personal (por navegador), compartida con el panel de
// staff (index.html) para que la elección de acá se mantenga al entrar.
const UI_THEME_KEY = `${APP_CONFIG.storagePrefix}-ui-theme-v1`;
const themeSelect = document.getElementById('theme-select');
const savedTheme = localStorage.getItem(UI_THEME_KEY) || 'light';
document.documentElement.dataset.theme = savedTheme;
themeSelect.value = savedTheme;
themeSelect.addEventListener('change', e => {
  document.documentElement.dataset.theme = e.target.value;
  localStorage.setItem(UI_THEME_KEY, e.target.value);
});
const tabClient=document.getElementById('tab-client'), tabStaff=document.getElementById('tab-staff'), formClient=document.getElementById('form-client'), formStaff=document.getElementById('form-staff'), errorEl=document.getElementById('error-msg');
const toggleStaffPass=document.getElementById('toggle-staff-pass'), staffPassInput=document.getElementById('staff-pass');
toggleStaffPass.addEventListener('click',()=>{
  const showing=staffPassInput.type==='text';
  staffPassInput.type=showing?'password':'text';
  toggleStaffPass.textContent=showing?'👁':'🙈';
  toggleStaffPass.setAttribute('aria-label',showing?'Mostrar contraseña':'Ocultar contraseña');
});
function showError(msg){errorEl.textContent=msg;errorEl.classList.remove('d-none');}
function clearError(){errorEl.classList.add('d-none');}
function switchAccess(type){const client=type==='client';tabClient.classList.toggle('active',client);tabStaff.classList.toggle('active',!client);formClient.classList.toggle('active',client);formStaff.classList.toggle('active',!client);clearError();}
tabClient.addEventListener('click',()=>switchAccess('client')); tabStaff.addEventListener('click',()=>switchAccess('staff'));
/* El carnet/teléfono y el correo/contraseña ya NO se verifican descargando toda
   la tabla de clientes o de staff al navegador: se validan en el servidor con
   las funciones login_cliente/login_staff (ver supabase-security-update.sql).
   El navegador solo recibe el id/nombre/rol de la persona que coincidió. */
formClient.addEventListener('submit',async e=>{
  e.preventDefault();clearError();
  const carnet=document.getElementById('client-carnet').value.trim(),phone=document.getElementById('client-phone').value.replace(/\D/g,'');
  const rows=await window.SupabaseDB?.rpc('login_cliente',{p_carnet:carnet,p_phone:phone});
  const client=Array.isArray(rows)?rows[0]:null;
  if(!client){showError('Carnet o teléfono no coinciden con un cliente registrado.');return;}
  sessionStorage.setItem(CLIENT_SESSION_KEY,JSON.stringify({id:client.id,name:client.name}));
  window.location.href=CLIENT_PORTAL_URL;
});
formStaff.addEventListener('submit',async e=>{
  e.preventDefault();clearError();
  const email=document.getElementById('staff-email').value.trim(),password=document.getElementById('staff-pass').value;
  const rows=await window.SupabaseDB?.rpc('login_staff',{p_email:email,p_password:password});
  const person=Array.isArray(rows)?rows[0]:null;
  if(!person){showError('Correo o contraseña incorrectos.');return;}
  sessionStorage.setItem(STAFF_SESSION_KEY,JSON.stringify({id:person.id,name:person.name,role:person.role,routeId:person.routeId||'',driverId:person.driverId||''}));
  window.location.href=STAFF_APP_URL;
});
if(sessionStorage.getItem(STAFF_SESSION_KEY)) window.location.href=STAFF_APP_URL;
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
