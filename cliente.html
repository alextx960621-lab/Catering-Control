<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Catering Control · Mi plan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

  <!-- Igual que en login-react.html: config.js/supabase-client.js no cambian
       en nada, y React + Babel se cargan por CDN, sin build (Vite) todavía. -->
  <script src="./config.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="./supabase-client.js" defer></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0d6efd">
  <link rel="icon" href="./icons/favicon-32.png" type="image/png">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Catering">

  <style>
    /* ===== Contenido de cliente.css, sin cambios de diseño ===== */
    :root{--font:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;--font-display:Figtree,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    body{background:var(--page-bg,#f5f7fb);font-family:var(--font)}
    h1,h2,h3,.btn{font-family:var(--font-display)}
    .portal{max-width:1080px}.portal .card{border-radius:1rem}.brand-image{width:42px;height:42px;object-fit:contain}.hero{background:linear-gradient(115deg,#0d6efd,#198754);color:#fff}.metric{background:var(--bs-tertiary-bg);border-radius:1rem}.client-avatar{width:52px;height:52px;background:rgba(255,255,255,.2)}.instagram{background:linear-gradient(125deg,#833ab4,#fd1d1d,#fcb045);color:#fff;text-decoration:none}.hidden{display:none!important}
    .pause-mode-card{border-radius:1rem;cursor:pointer;transition:border-color .15s ease,background .15s ease,box-shadow .15s ease}
    .btn-check:checked+.pause-mode-card{border-color:var(--bs-primary)!important;background:color-mix(in srgb,var(--bs-primary) 8%,var(--bs-body-bg));box-shadow:0 0 0 2px color-mix(in srgb,var(--bs-primary) 25%,transparent)}
    .pause-mode-card:hover{border-color:color-mix(in srgb,var(--bs-primary) 45%,var(--bs-border-color))}
    [data-theme="night"]{--page-bg:#121824}
    [data-theme="forest"]{--page-bg:#dcefdc}
    [data-theme="forest"] .metric{background:#cde6cd}
    [data-theme="forest"] .navbar.bg-body{background:#eef7ee!important}
    .ad-banner img{width:100%;height:auto;display:block}
    .renewal-banner{background:linear-gradient(120deg,#e4002b,#ff4b3e);color:#fff;overflow:hidden;position:relative}
    .renewal-banner .ribbon{background:rgba(255,255,255,.18);border-radius:999px;display:inline-flex;align-items:center;gap:.4rem;padding:.25rem .75rem;font-weight:700;letter-spacing:.02em}
    .renewal-banner .bounce{display:inline-block;animation:renewal-bounce 1.4s ease-in-out infinite}
    .renewal-banner .btn-light{font-weight:700}
    @keyframes renewal-bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
    .client-logout-btn{
      position:fixed;
      top:14px;
      right:14px;
      z-index:1050;
      display:inline-flex;
      align-items:center;
      gap:8px;
      border:none;
      border-radius:999px;
      padding:11px 18px;
      font:650 14.5px/1 var(--font-display);
      color:#fff;
      background:linear-gradient(135deg,color-mix(in srgb,#e4002b 78%,white 22%),#e4002b);
      box-shadow:0 4px 14px color-mix(in srgb,#e4002b 38%,transparent),0 2px 6px rgba(0,0,0,.12);
      cursor:pointer;
      transition:transform .15s ease,box-shadow .15s ease,filter .15s ease;
    }
    .client-logout-btn:hover{transform:translateY(-2px);filter:brightness(.97);box-shadow:0 8px 22px color-mix(in srgb,#e4002b 42%,transparent),0 3px 8px rgba(0,0,0,.14)}
    .client-logout-btn:active{transform:translateY(0) scale(.97)}
    .client-logout-btn svg{flex:0 0 auto;display:block}
    @media (max-width:480px){.client-logout-btn{top:10px;right:10px;padding:10px 14px}}
    [data-theme="night"] .client-logout-btn{background:linear-gradient(135deg,color-mix(in srgb,#ff4d4d 78%,white 22%),#ff4d4d);box-shadow:0 4px 14px color-mix(in srgb,#ff4d4d 38%,transparent),0 2px 6px rgba(0,0,0,.12)}
    [data-theme="night"] .client-logout-btn:hover{box-shadow:0 8px 22px color-mix(in srgb,#ff4d4d 42%,transparent),0 3px 8px rgba(0,0,0,.14)}
    [data-theme="forest"] .client-logout-btn{background:linear-gradient(135deg,color-mix(in srgb,#b3001f 78%,white 22%),#b3001f);box-shadow:0 4px 14px color-mix(in srgb,#b3001f 38%,transparent),0 2px 6px rgba(0,0,0,.12)}
    [data-theme="forest"] .client-logout-btn:hover{box-shadow:0 8px 22px color-mix(in srgb,#b3001f 42%,transparent),0 3px 8px rgba(0,0,0,.14)}
    main.portal{padding-top:66px}
    @media (max-width:480px){main.portal{padding-top:60px}}
    .portal .btn{border-radius:999px;font-weight:650;box-shadow:0 3px 10px rgba(0,0,0,.08);transition:transform .15s ease,box-shadow .15s ease,filter .15s ease}
    .portal .btn:hover{transform:translateY(-2px);filter:brightness(1.03)}
    .portal .btn:active{transform:translateY(0) scale(.98)}
    .portal .btn-primary{background:linear-gradient(135deg,#4c8bff,#0d6efd);border-color:transparent;box-shadow:0 4px 14px rgba(13,110,253,.35)}
    .portal .btn-primary:hover{box-shadow:0 8px 22px rgba(13,110,253,.4)}
    .portal .btn-success{background:linear-gradient(135deg,#28b16b,#198754);border-color:transparent;box-shadow:0 4px 14px rgba(25,135,84,.32)}
    .portal .btn-success:hover{box-shadow:0 8px 22px rgba(25,135,84,.38)}
    .premium-lock{max-width:460px;margin:40px auto;padding:28px 24px;text-align:center;border-radius:1rem;color:#fff;background:linear-gradient(120deg,#e4002b,#ff4b3e);box-shadow:0 10px 30px rgba(228,0,43,.25)}
    .premium-lock .premium-lock-icon{font-size:32px;margin-bottom:8px}
    .premium-lock h2{font-size:18px;margin:0 0 8px}
    .premium-lock p{margin:0 0 16px;opacity:.95;font-size:14px}
    .btn-premium{display:inline-block;background:#fff;color:#e4002b;font-weight:700;padding:10px 18px;border-radius:999px;text-decoration:none}
    .btn-premium:hover{filter:brightness(.95)}
  </style>
</head>
<body>
  <main class="container portal py-3 py-md-4" id="portal-root"></main>

  <script type="text/babel" data-type="module">
    function boot() {
    const { useState, useEffect, useRef, useMemo } = React;

    const APP_CONFIG = window.APP_CONFIG;
    const OPERATIONS_KEY = `${APP_CONFIG.storagePrefix}-operaciones-v3`;
    const CLIENT_ROW_KEY = `${APP_CONFIG.storagePrefix}-client-row-v1`;
    const CLIENT_SESSION_KEY = `${APP_CONFIG.storagePrefix}-client-session-v1`;
    const THEME_KEY = `${APP_CONFIG.storagePrefix}-client-theme-v1`;
    const CLIENT_THEME_STORE_KEY = `${APP_CONFIG.storagePrefix}-client-theme-store-v1`;
    const BRANDING_KEY = `${APP_CONFIG.storagePrefix}-client-branding-v1`;
    const DEFAULT_ITEMS = [['shots','Shots'],['proteins','Proteínas'],['juices','Jugos'],['breakfast','Desayuno'],['snack1','Merienda 1'],['lunch','Almuerzo'],['snack2','Merienda 2'],['dinner','Cena']];

    const n = v => Number(v) || 0;
    const fmt = d => d ? d.split('-').reverse().join('/') : '';

    // ---------- Helpers de negocio (idénticos a los de cliente.js) ----------
    function workDate(data) { return data.currentDate || new Date().toISOString().slice(0, 10); }
    function dayInfo(data, date) { return data.days?.[date] || { laborable: true }; }
    function addDays(date, count) { const d = new Date(date + 'T12:00:00'); d.setDate(d.getDate() + count); return d.toISOString().slice(0, 10); }
    function nextWorkDay(data, date) { let result = addDays(date, 1), guard = 0; while (!dayInfo(data, result).laborable && guard++ < 370) result = addDays(result, 1); return result; }
    function planFor(data, client) { return data.plans?.find(p => p.id === client.planId); }
    function stateFor(data, client, date) {
      if (!dayInfo(data, date).laborable) return 'No laborable';
      if (client.returnDate && date >= client.returnDate) return 'Activo';
      if (client.pauseStart && date >= client.pauseStart && (!client.returnDate || date < client.returnDate)) return 'Pausado';
      if (client.pauseDates?.includes(date)) return 'Pausado';
      if (client.startDate && client.startDate > date) return 'Programado';
      if (n(client.paidDays) && n(client.consumedDays) >= n(client.paidDays)) return 'Retorno pendiente';
      return client.status || 'Activo';
    }
    function statusClass(state) { return state === 'Activo' ? 'success' : state === 'Pausado' ? 'warning text-dark' : 'secondary'; }
    function whatsappNumber(branding) { return branding.whatsappNumber || APP_CONFIG.whatsappNumber; }
    function waLink(branding, text) { const num = whatsappNumber(branding); return num ? `https://wa.me/${num}?text=${encodeURIComponent(text)}` : '#'; }
    function renewalWarningDays(branding) { return Number.isFinite(branding.renewalWarningDays) ? branding.renewalWarningDays : 3; }
    function menuItemsList(branding) { return branding.menuItems && branding.menuItems.length ? branding.menuItems : DEFAULT_ITEMS; }

    function readCachedBranding() {
      try { return JSON.parse(localStorage.getItem(BRANDING_KEY)) || {}; } catch (_) { return {}; }
    }
    function readClientThemeStore() {
      try { return JSON.parse(localStorage.getItem(CLIENT_THEME_STORE_KEY)) || {}; } catch (_) { return {}; }
    }
    function getClientTheme(clientId) {
      const store = readClientThemeStore(), key = clientId || 'default';
      if (!store[key]) {
        store[key] = localStorage.getItem(THEME_KEY) || 'light';
        try { localStorage.setItem(CLIENT_THEME_STORE_KEY, JSON.stringify(store)); } catch (_) {}
      }
      return store[key];
    }
    function saveClientTheme(clientId, theme) {
      const store = readClientThemeStore(), key = clientId || 'default';
      store[key] = theme;
      try { localStorage.setItem(CLIENT_THEME_STORE_KEY, JSON.stringify(store)); } catch (_) {}
    }

    async function fetchBrandingRemote() {
      try {
        const settings = await window.SupabaseDB?.rpc('get_branding', {});
        if (!settings) return null;
        const b = {
          companyName: settings.companyName, logoUrl: settings.logoUrl,
          itemIcons: settings.itemIcons || {}, whatsappNumber: settings.whatsappNumber,
          instagramUrl: settings.instagramUrl, instagramHandle: settings.instagramHandle,
          adImageUrl: settings.adImageUrl, renewalWarningDays: settings.renewalWarningDays,
          menuItems: (settings.menuItems || []).map(m => [m.key, m.label])
        };
        try { localStorage.setItem(BRANDING_KEY, JSON.stringify(b)); } catch (_) {}
        return b;
      } catch (_) { return null; }
    }
    // Igual que en cliente.js: si get_plan_status() no manda todavía el
    // candado individual del portal, por seguridad se asume bloqueado.
    async function fetchIsPremium() {
      try {
        const info = await window.SupabaseDB?.rpc('get_plan_status', {});
        if (!info) return false;
        const isPremiumPlan = info?.plan === 'premium';
        const locked = 'clientPortalLocked' in info
          ? !!info.clientPortalLocked
          : (info.premiumLockedPages && 'clientPortal' in info.premiumLockedPages ? !!info.premiumLockedPages.clientPortal : true);
        return isPremiumPlan || !locked;
      } catch (_) { return false; }
    }
    async function fetchServerSync(clientId) {
      try {
        const [remoteMeta, remoteClient] = await Promise.all([
          window.SupabaseDB?.dbGet('clientes'),
          window.SupabaseDB?.dbGetClientRow(clientId)
        ]);
        return { remoteMeta, remoteClient };
      } catch (_) { return { remoteMeta: null, remoteClient: null }; }
    }
    async function saveClient(updatedClient) {
      localStorage.setItem(CLIENT_ROW_KEY, JSON.stringify(updatedClient));
      try { return await window.SupabaseDB.dbUpsertClientRows([updatedClient]); } catch (_) { return false; }
    }

    const LOGOUT_ICON = (
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" /><path d="M16 17l5-5-5-5" /><path d="M21 12H9" />
      </svg>
    );

    function logout() {
      sessionStorage.removeItem(CLIENT_SESSION_KEY);
      window.location.href = './login.html';
    }

    // ---------- Componentes chicos ----------
    function LogoutButton() {
      return <button className="client-logout-btn" onClick={logout} title="Cerrar sesión">{LOGOUT_ICON}<span>Salir</span></button>;
    }

    function Header({ branding, theme, onThemeChange, showThemeSelect }) {
      return (
        <header className="navbar bg-body rounded-4 shadow-sm px-3 mb-3">
          <a className="navbar-brand d-flex align-items-center gap-2 m-0" href="#">
            <img loading="lazy" decoding="async" className="brand-image rounded-3"
              src={branding.logoUrl || APP_CONFIG.logoUrl} alt={branding.companyName || APP_CONFIG.companyName}
              onError={e => { e.target.style.display = 'none'; }} />
            <span><b className="d-block fs-6">{branding.companyName || APP_CONFIG.companyName}</b><small className="text-secondary">Mi portal de cliente</small></span>
          </a>
          {showThemeSelect && (
            <div className="d-flex align-items-center gap-2">
              <label className="form-label small text-secondary mb-0" htmlFor="theme">Tema</label>
              <select className="form-select form-select-sm" id="theme" aria-label="Tema" value={theme} onChange={e => onThemeChange(e.target.value)}>
                <option value="light">Claro</option>
                <option value="night">Nocturno</option>
                <option value="forest">Bosque</option>
              </select>
            </div>
          )}
        </header>
      );
    }

    function PremiumLock({ branding }) {
      const wa = whatsappNumber(branding) ? waLink(branding, 'Hola, quiero activar el plan Premium para acceder al portal de clientes.') : '';
      return (
        <>
          <LogoutButton />
          <Header branding={branding} showThemeSelect={false} />
          <div className="premium-lock">
            <div className="premium-lock-icon">🔒</div>
            <h2>Portal de clientes es una función Premium</h2>
            <p>Esta cuenta está en el plan Básico. Contacta a tu proveedor para activar el plan Premium y desbloquear esta función.</p>
            {wa && <a className="btn-premium" href={wa} target="_blank" rel="noopener">Contactar por WhatsApp</a>}
          </div>
        </>
      );
    }

    function Hero({ client }) {
      return (
        <section className="hero rounded-4 shadow-sm p-4 mb-3 d-flex align-items-center justify-content-between gap-3">
          <div><h1 className="h3 mb-1">Hola, {client.name}</h1><p className="mb-0 opacity-75">Consulta tu plan y gestiona tus entregas.</p></div>
          <div className="client-avatar rounded-circle d-flex align-items-center justify-content-center fw-bold fs-5">
            {(client.name || '?').slice(0, 1).toUpperCase()}
          </div>
        </section>
      );
    }

    function AdBanner({ branding }) {
      if (!branding.adImageUrl) return null;
      return <section className="ad-banner rounded-4 shadow-sm overflow-hidden mb-3"><img loading="lazy" decoding="async" src={branding.adImageUrl} alt="Publicidad" className="d-block" /></section>;
    }

    function RenewalBanner({ data, client, branding, plan, state, remaining }) {
      const show = plan && n(client.paidDays) > 0 && remaining <= renewalWarningDays(branding) && !['Pausado', 'Programado', 'No laborable'].includes(state);
      if (!show) return null;
      const wa = whatsappNumber(branding) ? waLink(branding, `Hola, soy ${client.name}. ${remaining <= 0 ? 'Mi plan ya terminó y' : `Me quedan ${remaining} día(s) y`} quiero renovarlo.`) : '';
      return (
        <section className="renewal-banner rounded-4 shadow-sm p-4 mb-3 d-flex align-items-center justify-content-between flex-wrap gap-3">
          <div className="d-flex align-items-center gap-3">
            <span className="bounce fs-1">🥤</span>
            <div>
              <span className="ribbon mb-2 d-inline-flex">{remaining <= 0 ? '¡Ya venció!' : remaining === 1 ? '¡Último día!' : `¡Solo ${remaining} días!`}</span>
              <h2 className="h5 mb-1 mt-2">{remaining <= 0 ? 'Tu plan ya terminó' : 'Tu plan está por terminar'}</h2>
              <p className="mb-0 opacity-90">{remaining <= 0 ? 'Renueva ahora para no perder tus entregas.' : 'Renueva ahora y no te quedes sin tus entregas.'} ¡Es rapidísimo! 🎉</p>
            </div>
          </div>
          {wa && <a className="btn btn-light rounded-pill px-4" href={wa} target="_blank" rel="noopener">Quiero renovar</a>}
        </section>
      );
    }

    function PlanCard({ client, branding, plan, state, remaining, included }) {
      const items = menuItemsList(branding).filter(([key]) => n(included[key]) > 0);
      return (
        <div className="col-lg-8">
          <article className="card shadow-sm border-0 h-100 text-center"><div className="card-body p-4">
            {plan?.photoUrl && <img loading="lazy" decoding="async" src={plan.photoUrl} alt={plan.name} style={{ width: 84, height: 84, objectFit: 'cover', borderRadius: 16, margin: '0 auto 12px' }} />}
            <h2 className="h5">Tu plan actual</h2>
            <p className="h3 mb-1">{plan?.name || 'Plan sin asignar'}</p>
            <span className={`badge text-bg-${statusClass(state)} rounded-pill mb-4`}>{state}</span>
            <div className="row g-2 justify-content-center">
              <div className="col-4"><div className="metric p-3"><small className="text-secondary d-block">Días pagados</small><strong className="fs-4">{n(client.paidDays)}</strong></div></div>
              <div className="col-4"><div className="metric p-3"><small className="text-secondary d-block">Consumidos</small><strong className="fs-4">{n(client.consumedDays)}</strong></div></div>
              <div className="col-4"><div className="metric p-3"><small className="text-secondary d-block">Restantes</small><strong className="fs-4">{remaining}</strong></div></div>
            </div>
            <div className="d-flex justify-content-center flex-wrap gap-2 mt-4">
              {items.length ? items.map(([key, label]) => {
                const icon = branding.itemIcons?.[key];
                return (
                  <span className="badge rounded-pill text-bg-light border" key={key}>
                    {icon && <img loading="lazy" decoding="async" src={icon} alt="" style={{ width: 18, height: 18, objectFit: 'cover', borderRadius: '50%', verticalAlign: -4, marginRight: 4 }} />}
                    {n(included[key])} {label}
                  </span>
                );
              }) : <span className="text-secondary">Sin artículos registrados.</span>}
            </div>
          </div></article>
        </div>
      );
    }

    function SupportCard({ client, branding }) {
      const wa = whatsappNumber(branding) ? waLink(branding, `Hola, soy ${client.name}. Quiero renovar o cambiar mi plan.`) : '';
      return (
        <div className="col-lg-4">
          <article className="card shadow-sm border-0 h-100"><div className="card-body p-4 d-flex flex-column">
            <h2 className="h5">Atención al cliente</h2>
            <p className="text-secondary">Para renovar o cambiar tu plan, escríbenos directamente.</p>
            {wa ? <a className="btn btn-success mt-auto" href={wa} target="_blank" rel="noopener">Contactar por WhatsApp</a>
                : <p className="text-secondary small mb-0">Contacta a tu proveedor para más información.</p>}
          </div></article>
        </div>
      );
    }

    function MessageAlert({ message }) {
      if (!message?.text) return null;
      return (
        <div className={`alert alert-${message.error ? 'danger' : 'warning'} mt-3 mb-0`}>
          {message.text}
          {message.showSupport && message.wa && <> <a className="alert-link" href={message.wa} target="_blank" rel="noopener">Contactar por WhatsApp</a></>}
        </div>
      );
    }

    // Reactivación programada (cuando ya hay returnDate futuro).
    function ScheduledResumeCard({ client, next, message, onAdvance }) {
      return (
        <article className="card shadow-sm border-0"><div className="card-body p-4">
          <h2 className="h5 mb-1">✅ Reactivación programada</h2>
          <p className="text-secondary">Tu servicio se reactivará automáticamente el <b>{fmt(client.returnDate)}</b>. No necesitas hacer nada más.</p>
          <p className="text-secondary small mb-3">¿Necesitas que sea antes? Puedes adelantarla al siguiente día laborable.</p>
          <button className="btn btn-outline-primary btn-sm" onClick={onAdvance}>Adelantar reactivación al {fmt(next)}</button>
          <MessageAlert message={message} />
        </div></article>
      );
    }

    // Formulario de reactivación (cuando está pausado sin fecha de retorno futura).
    function ResumeForm({ next, message, onConfirm }) {
      const [byDate, setByDate] = useState(false);
      const [resumeDate, setResumeDate] = useState('');
      return (
        <article className="card shadow-sm border-0"><div className="card-body p-4">
          <h2 className="h5 mb-1">Reactivar servicio</h2>
          <p className="text-secondary">Elige cuándo quieres que se reactive. Puedes confirmarlo hasta las <b>22:00</b>.</p>
          <div className="row g-2 mb-3">
            <div className="col-sm-6">
              <input className="btn-check" type="radio" name="resume-mode" id="resume-mode-next" checked={!byDate} onChange={() => setByDate(false)} />
              <label className="pause-mode-card border d-block h-100 p-3" htmlFor="resume-mode-next">
                <span className="d-block fw-semibold">▶ Mañana mismo</span>
                <span className="d-block small text-secondary mt-1">Se reactiva el siguiente día laborable: {fmt(next)}.</span>
              </label>
            </div>
            <div className="col-sm-6">
              <input className="btn-check" type="radio" name="resume-mode" id="resume-mode-date" checked={byDate} onChange={() => setByDate(true)} />
              <label className="pause-mode-card border d-block h-100 p-3" htmlFor="resume-mode-date">
                <span className="d-block fw-semibold">📅 Elegir fecha</span>
                <span className="d-block small text-secondary mt-1">Por ejemplo, si vuelves recién en un par de días.</span>
              </label>
            </div>
          </div>
          {byDate && (
            <div className="mb-3">
              <label className="form-label" htmlFor="resume-date">¿Qué día quieres reactivarla?</label>
              <input className="form-control" type="date" id="resume-date" min={next} value={resumeDate} onChange={e => setResumeDate(e.target.value)} />
            </div>
          )}
          <button className="btn btn-primary" onClick={() => onConfirm(byDate, resumeDate)}>Confirmar reactivación</button>
          <MessageAlert message={message} />
        </div></article>
      );
    }

    // Formulario de pausa (cuando está activo).
    function PauseForm({ next, message, onConfirm }) {
      const [mode, setMode] = useState('open');
      const [returnDate, setReturnDate] = useState('');
      return (
        <article className="card shadow-sm border-0"><div className="card-body p-4">
          <h2 className="h5 mb-1">Pausar servicio</h2>
          <p className="text-secondary">Elige cómo quieres pausar. Se aplica desde el siguiente día laborable: <b>{fmt(next)}</b>, y puedes confirmarlo hasta las <b>22:00</b>.</p>
          <div className="row g-2 mb-3">
            <div className="col-sm-4">
              <input className="btn-check" type="radio" name="pause-mode" id="pause-mode-open" checked={mode === 'open'} onChange={() => setMode('open')} />
              <label className="pause-mode-card border d-block h-100 p-3" htmlFor="pause-mode-open">
                <span className="d-block fw-semibold">⏸ Pausa sin fecha</span>
                <span className="d-block small text-secondary mt-1">Reactivas cuando quieras, avisándonos por acá o por WhatsApp.</span>
              </label>
            </div>
            <div className="col-sm-4">
              <input className="btn-check" type="radio" name="pause-mode" id="pause-mode-tomorrow" checked={mode === 'tomorrow'} onChange={() => setMode('tomorrow')} />
              <label className="pause-mode-card border d-block h-100 p-3" htmlFor="pause-mode-tomorrow">
                <span className="d-block fw-semibold">1️⃣ Solo mañana</span>
                <span className="d-block small text-secondary mt-1">Se pausa un solo día ({fmt(next)}) y se reactiva sola al siguiente.</span>
              </label>
            </div>
            <div className="col-sm-4">
              <input className="btn-check" type="radio" name="pause-mode" id="pause-mode-scheduled" checked={mode === 'scheduled'} onChange={() => setMode('scheduled')} />
              <label className="pause-mode-card border d-block h-100 p-3" htmlFor="pause-mode-scheduled">
                <span className="d-block fw-semibold">📅 Con fecha de retorno</span>
                <span className="d-block small text-secondary mt-1">Se reactiva sola el día que elijas, sin que tengas que avisar.</span>
              </label>
            </div>
          </div>
          {mode === 'scheduled' && (
            <div className="mb-3">
              <label className="form-label" htmlFor="return-date">¿Qué día quieres reactivarla?</label>
              <input className="form-control" type="date" id="return-date" min={next} value={returnDate} onChange={e => setReturnDate(e.target.value)} />
            </div>
          )}
          <button className="btn btn-primary" onClick={() => onConfirm(mode, returnDate)}>Confirmar pausa</button>
          <MessageAlert message={message} />
        </div></article>
      );
    }

    // Tarjeta de dirección del cliente. Cubre dos casos:
    //  1) Cambiar la dirección HABITUAL (client.activeAddressId) — desde
    //     ahora en adelante, eligiendo entre las direcciones que ya tiene
    //     guardadas. Se guarda directo con dbUpsertClientRows, igual que la
    //     pausa/reactivación (mismo modelo de confianza: RLS ya le permite
    //     al cliente escribir su propia fila).
    //  2) Un cambio puntual SOLO para el próximo día laborable (usa la RPC
    //     set_client_address_override que ya existía) — útil para una
    //     excepción sin tocar su dirección de siempre.
    // Si el cliente quiere una dirección que todavía no tiene guardada,
    // no hay forma de "agregarla" desde acá a propósito: necesita que el
    // equipo la tome bien (ubicación exacta, ruta, etc.), así que se le
    // ofrece un botón directo de WhatsApp para eso.
    function AddressCard({ client, data, branding, onSaveClient, onSaveTomorrowOverride }) {
      const addresses = client.addresses || [];
      const next = nextWorkDay(data, workDate(data));
      const currentOverrideId = (client.addressOverrides || []).find(o => o.date === next)?.addressId || '';
      const hasChoice = addresses.length >= 2;
      const [mode, setMode] = useState('permanent'); // 'permanent' | 'tomorrow'
      const [selected, setSelected] = useState(currentOverrideId || client.activeAddressId || addresses[0]?.id || '');
      const [feedback, setFeedback] = useState(null);
      const [saving, setSaving] = useState(false);
      const waNewAddress = whatsappNumber(branding) ? waLink(branding, `Hola, soy ${client.name}. Quiero agregar una nueva dirección de entrega.`) : '';

      async function handleSave() {
        if (!selected) return;
        setSaving(true);
        let result;
        if (mode === 'tomorrow') {
          result = await onSaveTomorrowOverride(selected);
        } else if (selected === client.activeAddressId) {
          result = { error: false, text: 'Esa ya es tu dirección de entrega actual.' };
        } else {
          const updated = { ...client, activeAddressId: selected };
          const saved = await onSaveClient(updated);
          if (saved) {
            window.SupabaseDB?.dbInsertAudit({ actor_id: client.id, actor_name: client.name, actor_role: 'cliente', action: 'Cliente cambió su dirección habitual (autoservicio)', entity_type: 'client', entity_label: client.name, entity_id: client.id, details: { addressId: selected } });
          }
          result = saved
            ? { error: false, text: 'Listo — esa será tu dirección de entrega desde ahora, hasta que la cambies de nuevo.' }
            : { error: true, text: 'No se pudo guardar. Intenta nuevamente o contáctanos por WhatsApp.' };
        }
        setSaving(false);
        setFeedback(result);
      }

      return (
        <div className="col-12"><article className="card shadow-sm border-0"><div className="card-body p-4">
          <h2 className="h5 mb-1">📍 Tu dirección de entrega</h2>
          {!hasChoice && (
            <p className="text-secondary mb-3">Actualmente entregamos en: <b>{addresses[0]?.address || 'sin dirección registrada'}</b>. Solo tienes esta dirección guardada.</p>
          )}
          {hasChoice && (
            <>
              <p className="text-secondary">Elige entre tus direcciones guardadas. Puedes cambiarla desde ahora en adelante, o solo para el próximo día de entrega ({fmt(next)}) sin tocar tu dirección de siempre.</p>
              <div className="row g-2 mb-3">
                <div className="col-sm-6">
                  <input className="btn-check" type="radio" name="address-mode" id="address-mode-permanent" checked={mode === 'permanent'} onChange={() => setMode('permanent')} />
                  <label className="pause-mode-card border d-block h-100 p-3" htmlFor="address-mode-permanent">
                    <span className="d-block fw-semibold">🏠 Desde ahora en adelante</span>
                    <span className="d-block small text-secondary mt-1">Cambia tu dirección habitual hasta que la vuelvas a cambiar.</span>
                  </label>
                </div>
                <div className="col-sm-6">
                  <input className="btn-check" type="radio" name="address-mode" id="address-mode-tomorrow" checked={mode === 'tomorrow'} onChange={() => setMode('tomorrow')} />
                  <label className="pause-mode-card border d-block h-100 p-3" htmlFor="address-mode-tomorrow">
                    <span className="d-block fw-semibold">📅 Solo el {fmt(next)}</span>
                    <span className="d-block small text-secondary mt-1">Cambio puntual; después vuelve a tu dirección de siempre.</span>
                  </label>
                </div>
              </div>
              <div className="row g-2 align-items-end">
                <div className="col-sm-8">
                  <label className="form-label" htmlFor="address-select">{mode === 'tomorrow' ? `Dirección para el ${fmt(next)}` : 'Nueva dirección habitual'}</label>
                  <select className="form-select" id="address-select" value={selected} onChange={e => setSelected(e.target.value)}>
                    {addresses.map(a => <option value={a.id} key={a.id}>{a.address || 'Sin nombre'}{a.id === client.activeAddressId ? ' (actual)' : ''}</option>)}
                  </select>
                </div>
                <div className="col-sm-4"><button className="btn btn-primary w-100" onClick={handleSave} disabled={saving}>{saving ? 'Guardando…' : 'Guardar'}</button></div>
              </div>
              {mode === 'tomorrow' && currentOverrideId && <p className="text-secondary small mt-2 mb-0">Ya elegiste una dirección distinta solo para el {fmt(next)}. Si no cambias nada, se usará esa.</p>}
            </>
          )}
          {feedback && <div className={`alert mt-3 mb-0 alert-${feedback.error ? 'danger' : 'success'}`}>{feedback.text}</div>}
          {waNewAddress && (
            <p className="text-secondary small mt-3 mb-0">¿Necesitas una dirección que no está en la lista? <a href={waNewAddress} target="_blank" rel="noopener">Escríbenos por WhatsApp</a> para tomar los datos correctamente.</p>
          )}
        </div></article></div>
      );
    }

    function NoteCard({ client }) {
      const [text, setText] = useState('');
      const [feedback, setFeedback] = useState(null);
      const [sending, setSending] = useState(false);

      async function handleSend() {
        if (!text.trim()) { setFeedback({ error: true, text: 'Escribe un mensaje antes de enviarlo.' }); return; }
        setSending(true);
        const result = await window.SupabaseDB?.rpc('crear_nota_cliente', { p_client_id: client.id, p_texto: text });
        setSending(false);
        if (!result) { setFeedback({ error: true, text: 'No se pudo enviar. Intenta nuevamente o contáctanos por WhatsApp.' }); return; }
        setText('');
        setFeedback({ error: false, text: '¡Mensaje enviado! El equipo se pondrá en contacto contigo.' });
      }

      return (
        <div className="col-12"><article className="card shadow-sm border-0"><div className="card-body p-4">
          <h2 className="h5">Déjanos un mensaje</h2>
          <p className="text-secondary">¿Prefieres no escribir por WhatsApp? Cuéntanos qué necesitas (ej.: "Llámenme mañana para cambiar de plan") y el equipo te contacta.</p>
          <textarea className="form-control mb-3" rows="2" placeholder="Escribe tu mensaje…" value={text} onChange={e => setText(e.target.value)}></textarea>
          <button className="btn btn-primary" onClick={handleSend} disabled={sending}>{sending ? 'Enviando…' : 'Enviar mensaje'}</button>
          {feedback && <div className={`alert mt-3 mb-0 alert-${feedback.error ? 'danger' : 'success'}`}>{feedback.text}</div>}
        </div></article></div>
      );
    }

    function InstagramLink({ branding }) {
      const url = branding.instagramUrl || APP_CONFIG.instagramUrl;
      if (!url) return null;
      return (
        <div className="col-12">
          <a className="instagram d-flex align-items-center gap-3 rounded-4 p-3 shadow-sm" href={url} target="_blank" rel="noopener">
            <span className="fs-3">◎</span>
            <span><b className="d-block">Seguinos en Instagram</b><small>{branding.instagramHandle || APP_CONFIG.instagramHandle} · novedades, menús y bienestar</small></span>
          </a>
        </div>
      );
    }

    // ---------- Portal completo (una vez cargado todo) ----------
    function Portal({ data, client, branding, theme, onThemeChange, onSaveClient }) {
      const [message, setMessage] = useState(null); // { text, error, showSupport, wa }
      const date = workDate(data);
      const next = nextWorkDay(data, date);
      const state = stateFor(data, client, date);
      const plan = planFor(data, client);
      const remaining = Math.max(0, n(client.paidDays) - n(client.consumedDays));
      const included = client.items && Object.keys(client.items).length ? client.items : (plan?.items || {});

      function guardedFail(text, showSupport) {
        setMessage({ text, error: true, showSupport, wa: showSupport ? waLink(branding, `Hola, soy ${client.name}. Necesito ayuda con mi cuenta.`) : '' });
      }

      async function handlePause(mode, returnDateInput) {
        const now = new Date();
        if (now.getHours() >= 22) { setMessage({ text: 'Ya pasó el horario de pausa automática. Ponte en contacto con Atención al Cliente.', error: true, showSupport: true, wa: waLink(branding, `Hola, soy ${client.name}. Necesito solicitar una pausa de mi servicio.`) }); return; }
        if (mode === 'scheduled' && !returnDateInput) { setMessage({ text: 'Selecciona una fecha de retorno para esta opción.', error: true }); return; }
        const returnDate = mode === 'tomorrow' ? nextWorkDay(data, next) : mode === 'scheduled' ? returnDateInput : '';
        if (returnDate && returnDate <= next) { setMessage({ text: 'La fecha de retorno debe ser posterior al día pausado.', error: true }); return; }
        const updated = { ...client, pauseStart: next, returnDate, status: returnDate ? 'Programado' : 'Pausado', pauseDates: (client.pauseDates || []).filter(d => d !== next) };
        const saved = await onSaveClient(updated);
        if (!saved) { setMessage({ text: 'No se pudo guardar la pausa en la base de datos. Intenta nuevamente.', error: true }); return; }
        window.SupabaseDB?.dbInsertAudit({ actor_id: client.id, actor_name: client.name, actor_role: 'cliente', action: 'Cliente pausó su servicio (autoservicio)', entity_type: 'client', entity_label: client.name, entity_id: client.id, details: { desde: next, retorno: returnDate || 'sin definir', modo: mode } });
        setMessage({
          text: mode === 'tomorrow' ? `Pausa de un solo día (${fmt(next)}). Se reactiva sola el ${fmt(returnDate)}.`
            : returnDate ? `Pausa programada desde el ${fmt(next)} hasta el ${fmt(returnDate)}.`
            : `Pausa abierta desde el ${fmt(next)} sin fecha de retorno.`,
          error: false
        });
      }

      async function handleResume(byDate, resumeDateInput) {
        const now = new Date();
        if (now.getHours() >= 22) { setMessage({ text: 'Ya pasó el horario de reactivación automática. Ponte en contacto con Atención al Cliente.', error: true, showSupport: true, wa: waLink(branding, `Hola, soy ${client.name}. Necesito reactivar mi servicio.`) }); return; }
        const target = byDate ? resumeDateInput : next;
        if (byDate && !target) { setMessage({ text: 'Selecciona una fecha de reactivación.', error: true }); return; }
        if (target < next) { setMessage({ text: 'La fecha de reactivación debe ser el siguiente día laborable o una posterior.', error: true }); return; }
        const updated = { ...client, returnDate: target, status: 'Programado' };
        const saved = await onSaveClient(updated);
        if (!saved) { setMessage({ text: 'No se pudo guardar la reactivación en la base de datos. Intenta nuevamente.', error: true }); return; }
        window.SupabaseDB?.dbInsertAudit({ actor_id: client.id, actor_name: client.name, actor_role: 'cliente', action: 'Cliente reactivó su servicio (autoservicio)', entity_type: 'client', entity_label: client.name, entity_id: client.id, details: { reactivaDesde: target } });
        setMessage({ text: `Reactivación programada para el ${fmt(target)}.`, error: false });
      }

      async function handleAddressOverride(selectedAddressId) {
        const now = new Date();
        if (now.getHours() >= 22) return { error: true, text: 'Ya pasó el horario para cambiar la dirección de mañana. Ponte en contacto con Atención al Cliente.' };
        const result = await window.SupabaseDB?.rpc('set_client_address_override', { p_client_id: client.id, p_address_id: selectedAddressId, p_date: next });
        if (!result) return { error: true, text: 'No se pudo guardar. Intenta nuevamente o contáctanos por WhatsApp.' };
        const overrides = Array.isArray(result) ? result : (client.addressOverrides || []).filter(o => o.date !== next).concat([{ date: next, addressId: selectedAddressId }]);
        const updated = { ...client, addressOverrides: overrides };
        localStorage.setItem(CLIENT_ROW_KEY, JSON.stringify(updated));
        onSaveClient(updated, true); // true = solo actualizar estado local, ya se guardó vía la RPC de arriba
        window.SupabaseDB?.dbInsertAudit({ actor_id: client.id, actor_name: client.name, actor_role: 'cliente', action: 'Cliente cambió su dirección de entrega (autoservicio)', entity_type: 'client', entity_label: client.name, entity_id: client.id, details: { fecha: next, addressId: selectedAddressId } });
        return { error: false, text: 'Guardado. Se usará esa dirección para el pedido de mañana.' };
      }

      return (
        <>
          <LogoutButton />
          <Header branding={branding} theme={theme} onThemeChange={onThemeChange} showThemeSelect={true} />
          <Hero client={client} />
          <AdBanner branding={branding} />
          <RenewalBanner data={data} client={client} branding={branding} plan={plan} state={state} remaining={remaining} />
          <section className="row g-3">
            <PlanCard client={client} branding={branding} plan={plan} state={state} remaining={remaining} included={included} />
            <SupportCard client={client} branding={branding} />
            <div className="col-12">
              {state === 'Pausado'
                ? (client.returnDate && client.returnDate > date
                    ? <ScheduledResumeCard client={client} next={next} message={message} onAdvance={() => handleResume(false)} />
                    : <ResumeForm next={next} message={message} onConfirm={handleResume} />)
                : <PauseForm next={next} message={message} onConfirm={handlePause} />}
            </div>
            <AddressCard client={client} data={data} branding={branding} onSaveClient={onSaveClient} onSaveTomorrowOverride={handleAddressOverride} />
            <NoteCard client={client} />
            <InstagramLink branding={branding} />
          </section>
        </>
      );
    }

    // ---------- App raíz: maneja sesión, carga y estado premium ----------
    function App() {
      const [phase, setPhase] = useState('checking'); // checking | locked | portal
      const [data, setData] = useState(null);
      const [client, setClient] = useState(null);
      const [branding, setBranding] = useState(() => readCachedBranding());
      const [theme, setTheme] = useState('light');
      const sessionRef = useRef(null);
      const bootedRef = useRef(false);

      useEffect(() => {
        if (bootedRef.current) return;
        bootedRef.current = true;
        (async () => {
          let localData, session;
          try {
            localData = JSON.parse(localStorage.getItem(OPERATIONS_KEY)) || {};
            session = JSON.parse(sessionStorage.getItem(CLIENT_SESSION_KEY));
          } catch (_) { localData = {}; session = null; }
          if (!session) { window.location.replace('./login.html'); return; }
          sessionRef.current = session;
          localData.days ||= {};

          let localClient = null;
          try { localClient = JSON.parse(localStorage.getItem(CLIENT_ROW_KEY)); } catch (_) {}
          if (!localClient || localClient.id !== session.id) {
            localClient = await window.SupabaseDB?.dbGetClientRow(session.id);
            if (!localClient) { window.location.replace('./login.html'); return; }
            localStorage.setItem(CLIENT_ROW_KEY, JSON.stringify(localClient));
          }

          setData(localData);
          setClient(localClient);
          setTheme(getClientTheme(session.id));

          const freshBranding = await fetchBrandingRemote();
          if (freshBranding) setBranding(freshBranding);

          if (!(await fetchIsPremium())) { setPhase('locked'); return; }
          setPhase('portal');
          window.SupabaseDB?.joinPresence({ id: localClient.id, role: 'cliente', name: localClient.name });

          // Segunda pasada en segundo plano, igual que el boot() original:
          // refresca datos del servidor y vuelve a chequear el candado Premium.
          const [{ remoteMeta, remoteClient }, freshBranding2] = await Promise.all([
            fetchServerSync(session.id),
            fetchBrandingRemote()
          ]);
          if (remoteMeta) {
            const merged = { ...localData, plans: remoteMeta.plans ?? localData.plans, days: remoteMeta.days ?? localData.days, currentDate: remoteMeta.currentDate ?? localData.currentDate };
            localStorage.setItem(OPERATIONS_KEY, JSON.stringify(merged));
            localData = merged;
            setData(merged);
          }
          if (remoteClient) {
            localStorage.setItem(CLIENT_ROW_KEY, JSON.stringify(remoteClient));
            localClient = remoteClient;
            setClient(remoteClient);
          }
          if (freshBranding2) setBranding(freshBranding2);
          if (!(await fetchIsPremium())) { setPhase('locked'); return; }
          setPhase('portal');
        })();
      }, []);

      useEffect(() => {
        if (phase === 'locked') {
          document.documentElement.dataset.bsTheme = 'light';
          document.documentElement.dataset.theme = 'light';
        } else if (phase === 'portal') {
          document.documentElement.dataset.bsTheme = theme === 'night' ? 'dark' : 'light';
          document.documentElement.dataset.theme = theme;
        }
      }, [phase, theme]);

      function handleThemeChange(newTheme) {
        if (sessionRef.current) saveClientTheme(sessionRef.current.id, newTheme);
        setTheme(newTheme);
      }

      // onLocalUpdateOnly=true: la dirección de mañana ya se guardó vía RPC
      // propia (set_client_address_override) — acá solo hay que reflejar el
      // cambio en el estado de React, sin volver a llamar dbUpsertClientRows.
      async function handleSaveClient(updated, onLocalUpdateOnly) {
        if (onLocalUpdateOnly) { setClient(updated); return true; }
        const saved = await saveClient(updated);
        if (saved) setClient(updated);
        return saved;
      }

      if (phase === 'checking') {
        return <p className="text-secondary text-center py-5">Cargando tu portal…</p>;
      }
      if (phase === 'locked') {
        return <PremiumLock branding={branding} />;
      }
      return <Portal data={data} client={client} branding={branding} theme={theme} onThemeChange={handleThemeChange} onSaveClient={handleSaveClient} />;
    }

    ReactDOM.createRoot(document.getElementById('portal-root')).render(<App />);
    } // fin de boot()

    if (window.APP_CONFIG && window.SupabaseDB) {
      boot();
    } else {
      const waitForDeps = setInterval(() => {
        if (window.APP_CONFIG && window.SupabaseDB) { clearInterval(waitForDeps); boot(); }
      }, 20);
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous" defer></script>
<script src="./pwa-register.js" defer></script>
</body>
