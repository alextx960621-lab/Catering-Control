<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Catering Control · Mi plan</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase-client.js"></script>
  <style>
    body{background:#f5f7fb}.portal{max-width:1080px}.brand-image{width:42px;height:42px;object-fit:contain}.hero{background:linear-gradient(115deg,#0d6efd,#198754);color:#fff}.metric{background:var(--bs-tertiary-bg);border-radius:.75rem}.client-avatar{width:52px;height:52px;background:rgba(255,255,255,.2)}.instagram{background:linear-gradient(125deg,#833ab4,#fd1d1d,#fcb045);color:#fff;text-decoration:none}.hidden{display:none!important}
  </style>
</head>
<body>
  <main class="container portal py-3 py-md-4" id="portal"></main>
  <script>
    (()=>{
      'use strict';

      /* ==========================================================================
         CONFIGURACIÓN DE LA EMPRESA
         Edita estos valores para personalizar el sistema para cada cliente/empresa.
         El "storagePrefix" debe coincidir con el usado en login.html y index.html.
         ========================================================================== */
      const APP_CONFIG = {
        companyName: 'Catering Control',        // Nombre de la empresa mostrado en el portal
        logoUrl: './logo.jpg',                  // Ruta o URL del logo de la empresa
        whatsappNumber: '',                     // Número de WhatsApp de atención (formato internacional sin +, ej. 59170000000). Déjalo vacío para ocultar el botón.
        instagramUrl: '',                       // URL del perfil de Instagram. Déjalo vacío para ocultar la tarjeta de Instagram.
        instagramHandle: '',                    // Usuario de Instagram mostrado, ej. @miempresa
        storagePrefix: 'catering-app'           // Prefijo usado para las claves de almacenamiento local
      };
      /* ========================================================================== */

      const OPERATIONS_KEY=`${APP_CONFIG.storagePrefix}-operaciones-v3`,CLIENT_SESSION_KEY=`${APP_CONFIG.storagePrefix}-client-session-v1`,THEME_KEY=`${APP_CONFIG.storagePrefix}-client-theme-v1`;
      const $=s=>document.querySelector(s),n=v=>Number(v)||0,items=[['shots','Shots'],['proteins','Proteínas'],['juices','Jugos'],['breakfast','Desayuno'],['snack1','Merienda 1'],['lunch','Almuerzo'],['snack2','Merienda 2'],['dinner','Cena']];
      const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c]));let data,session,client;
      let branding={};try{branding=JSON.parse(localStorage.getItem(`${APP_CONFIG.storagePrefix}-client-branding-v1`))||{};}catch(_){branding={};}
      async function syncBranding(){try{const personal=await window.SupabaseDB?.dbGet('personal');if(personal?.settings){branding={companyName:personal.settings.companyName,logoUrl:personal.settings.logoUrl,itemIcons:personal.settings.itemIcons||{}};localStorage.setItem(`${APP_CONFIG.storagePrefix}-client-branding-v1`,JSON.stringify(branding));}}catch(_){}}
      function read(){try{data=JSON.parse(localStorage.getItem(OPERATIONS_KEY));session=JSON.parse(sessionStorage.getItem(CLIENT_SESSION_KEY));}catch(_){data=null;session=null;}client=data?.clients?.find(c=>c.id===session?.id);if(!data||!client){location.replace('./login.html');return false;}data.days||={};return true;}
      async function syncFromServer(){
        try{
          const remote=await window.SupabaseDB?.dbGet('clientes');
          if(remote){
            data.clients=remote.clients??data.clients;
            data.plans=remote.plans??data.plans;
            data.days=remote.days??data.days;
            data.currentDate=remote.currentDate??data.currentDate;
            localStorage.setItem(OPERATIONS_KEY,JSON.stringify(data));
            client=data.clients?.find(c=>c.id===session?.id)||client;
          }
        }catch(_){}
      }
      async function save(){
        localStorage.setItem(OPERATIONS_KEY,JSON.stringify(data));
        try{
          return await window.SupabaseDB.dbSet('clientes',{clients:data.clients,plans:data.plans,days:data.days,currentDate:data.currentDate});
        }catch(_){return false;}
      }function workDate(){return data.currentDate||new Date().toISOString().slice(0,10)}function day(date){return data.days[date]||{laborable:true}}function addDays(date,count){const d=new Date(date+'T12:00:00');d.setDate(d.getDate()+count);return d.toISOString().slice(0,10)}function nextWorkDay(date){let result=addDays(date,1),guard=0;while(!day(result).laborable&&guard++<370)result=addDays(result,1);return result}function plan(){return data.plans?.find(p=>p.id===client.planId)}
      function stateFor(date){if(!day(date).laborable)return 'No laborable';if(client.returnDate&&date>=client.returnDate)return 'Activo';if(client.pauseStart&&date>=client.pauseStart&&(!client.returnDate||date<client.returnDate))return 'Pausado';if(client.pauseDates?.includes(date))return 'Pausado';if(client.startDate&&client.startDate>date)return 'Programado';if(n(client.paidDays)&&n(client.consumedDays)>=n(client.paidDays))return 'Retorno pendiente';return client.status||'Activo'}function statusClass(state){return state==='Activo'?'success':state==='Pausado'?'warning text-dark':'secondary'}function wa(text){return APP_CONFIG.whatsappNumber?`https://wa.me/${APP_CONFIG.whatsappNumber}?text=${encodeURIComponent(text)}`:'#'}
      function render(message='',error=false,showSupport=false){const date=workDate(),next=nextWorkDay(date),st=stateFor(date),p=plan(),remaining=Math.max(0,n(client.paidDays)-n(client.consumedDays)),included=client.items&&Object.keys(client.items).length?client.items:p?.items||{},theme=localStorage.getItem(THEME_KEY)||data.settings?.theme||'light';document.documentElement.dataset.bsTheme=theme==='night'?'dark':'light';
        $('#portal').innerHTML=`<header class="navbar bg-body rounded-3 shadow-sm px-3 mb-3"><a class="navbar-brand d-flex align-items-center gap-2 m-0" href="#"><img class="brand-image rounded-3" src="${esc(branding.logoUrl||APP_CONFIG.logoUrl)}" alt="${esc(branding.companyName||APP_CONFIG.companyName)}" onerror="this.style.display='none'"><span><b class="d-block fs-6">${esc(branding.companyName||APP_CONFIG.companyName)}</b><small class="text-secondary">Mi portal de cliente</small></span></a><div class="d-flex gap-2"><select class="form-select form-select-sm" id="theme" aria-label="Tema"><option value="light">Claro</option><option value="night">Nocturno</option><option value="forest">Bosque</option></select><button class="btn btn-outline-secondary btn-sm" id="logout">Salir</button></div></header>
        <section class="hero rounded-4 shadow-sm p-4 mb-3 d-flex align-items-center justify-content-between gap-3"><div><h1 class="h3 mb-1">Hola, ${esc(client.name)}</h1><p class="mb-0 opacity-75">Consulta tu plan y gestiona tus entregas.</p></div><div class="client-avatar rounded-circle d-grid place-items-center fw-bold fs-5 d-flex align-items-center justify-content-center">${esc((client.name||'?').slice(0,1).toUpperCase())}</div></section>
        <section class="row g-3"><div class="col-lg-8"><article class="card shadow-sm border-0 h-100 text-center"><div class="card-body p-4"><h2 class="h5">Tu plan actual</h2><p class="h3 mb-1">${esc(p?.name||'Plan sin asignar')}</p><span class="badge text-bg-${statusClass(st)} rounded-pill mb-4">${esc(st)}</span><div class="row g-2 justify-content-center"><div class="col-4"><div class="metric p-3"><small class="text-secondary d-block">Días pagados</small><strong class="fs-4">${n(client.paidDays)}</strong></div></div><div class="col-4"><div class="metric p-3"><small class="text-secondary d-block">Consumidos</small><strong class="fs-4">${n(client.consumedDays)}</strong></div></div><div class="col-4"><div class="metric p-3"><small class="text-secondary d-block">Restantes</small><strong class="fs-4">${remaining}</strong></div></div></div><div class="d-flex justify-content-center flex-wrap gap-2 mt-4">${items.filter(([key])=>n(included[key])>0).map(([key,label])=>{const icon=branding.itemIcons?.[key];return `<span class="badge rounded-pill text-bg-light border">${icon?`<img src="${icon}" alt="" style="width:14px;height:14px;object-fit:cover;border-radius:50%;vertical-align:-2px;margin-right:3px">`:''}${n(included[key])} ${label}</span>`;}).join('')||'<span class="text-secondary">Sin artículos registrados.</span>'}</div></div></article></div>
        <div class="col-lg-4"><article class="card shadow-sm border-0 h-100"><div class="card-body p-4 d-flex flex-column"><h2 class="h5">Atención al cliente</h2><p class="text-secondary">Para renovar o cambiar tu plan, escríbenos directamente.</p>${APP_CONFIG.whatsappNumber?`<a class="btn btn-success mt-auto" href="${wa(`Hola, soy ${client.name}. Quiero renovar o cambiar mi plan.`)}" target="_blank" rel="noopener">Contactar por WhatsApp</a>`:'<p class="text-secondary small mb-0">Contacta a tu proveedor para más información.</p>'}</div></article></div>
        <div class="col-12"><article class="card shadow-sm border-0"><div class="card-body p-4"><h2 class="h5">Pausar servicio</h2><p class="text-secondary">La pausa se aplica al siguiente día laborable: <b>${next.split('-').reverse().join('/')}</b>. Puedes programarla hasta las <b>22:00</b>.</p><div class="border rounded-3 p-3 mb-3"><div class="form-check mb-3"><input class="form-check-input" type="checkbox" id="pause-only" checked disabled><label class="form-check-label fw-semibold" for="pause-only">Pausar solo, sin fecha de retorno</label></div><div class="form-check mb-2"><input class="form-check-input" type="checkbox" id="with-return"><label class="form-check-label" for="with-return">Agregar fecha de retorno (opcional)</label></div><div id="return-date-wrap" hidden><label class="form-label" for="return-date">Fecha de retorno</label><input class="form-control" type="date" id="return-date" min="${next}" value="" disabled></div></div><button class="btn btn-primary" id="pause">Confirmar pausa</button><div class="alert alert-${error?'danger':'warning'} mt-3 mb-0 ${message?'':'d-none'}" id="message">${esc(message)}${showSupport&&APP_CONFIG.whatsappNumber?` <a class="alert-link" href="${wa(`Hola, soy ${client.name}. Necesito solicitar una pausa de mi servicio.`)}" target="_blank" rel="noopener">Contactar por WhatsApp</a>`:''}</div></div></article></div>
        ${APP_CONFIG.instagramUrl?`<div class="col-12"><a class="instagram d-flex align-items-center gap-3 rounded-4 p-3 shadow-sm" href="${esc(APP_CONFIG.instagramUrl)}" target="_blank" rel="noopener"><span class="fs-3">◎</span><span><b class="d-block">Seguinos en Instagram</b><small>${esc(APP_CONFIG.instagramHandle)} · novedades, menús y bienestar</small></span></a></div>`:''}</section>`;
        $('#theme').value=theme;$('#theme').onchange=e=>{localStorage.setItem(THEME_KEY,e.target.value);render();};$('#logout').onclick=()=>{sessionStorage.removeItem(CLIENT_SESSION_KEY);location.href='./login.html';};$('#with-return').onchange=e=>{const input=$('#return-date');$('#return-date-wrap').hidden=!e.target.checked;input.disabled=!e.target.checked;if(!e.target.checked)input.value='';};$('#pause').onclick=requestPause;
      }
      async function requestPause(){const now=new Date();if(now.getHours()>=22){render('Ya pasó el horario de pausa automática. Ponte en contacto con Atención al Cliente.',true,true);return;}const next=nextWorkDay(workDate()),returnDate=$('#with-return').checked?$('#return-date').value:'';if($('#with-return').checked&&!returnDate){render('Selecciona una fecha de retorno o desactiva esa opción.',true);return;}if(returnDate&&returnDate<=next){render('La fecha de retorno debe ser posterior al día pausado.',true);return;}client.pauseStart=next;client.returnDate=returnDate;client.status='Pausado';client.pauseDates=(client.pauseDates||[]).filter(d=>d!==next);const saved=await save();if(!saved){render('No se pudo guardar la pausa en la base de datos. Intenta nuevamente.',true);return;}render(returnDate?`Pausa programada desde el ${next.split('-').reverse().join('/')} hasta el ${returnDate.split('-').reverse().join('/')}.`:`Pausa abierta desde el ${next.split('-').reverse().join('/')} sin fecha de retorno.`);}
      if(read()){render();Promise.all([syncFromServer(),syncBranding()]).then(()=>render());}
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
